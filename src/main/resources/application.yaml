server:
  port: 8080

spring:
  application:
    name: ionov-tech-shop

  datasource:
    url: jdbc:postgresql://localhost:5432/ionov_shop
    username: ionov
    password: ionov123
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  session:
    jdbc:
      initialize-schema: always
      table-name: SPRING_SESSION

logging:
  level:
    root: INFO
    com.ionov: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always