<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | IONOV TECH SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; }
        .navbar { background: #1a1a2e; }
        footer { background: #1a1a2e; color: #aaa; padding: 20px 0; text-align: center; margin-top: 40px; }
        .btn-blue { background: #2563eb; border: none; color: white; }
        .btn-blue:hover { background: #1d4ed8; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color: #2563eb;">IONOV TECH SHOP</a>
        <a href="/" class="btn btn-outline-light btn-sm">На главную</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="text-center mb-4">Корзина</h2>
    <div id="cartItems"></div>
    <div id="totalBlock" class="text-end mt-3" style="display:none;">
        <h4>Итого: <span id="totalPrice" style="color: #2563eb;"></span> ₽</h4>
        <button class="btn btn-blue btn-lg mt-2" onclick="createOrder()">Оформить заказ</button>
    </div>
</div>

<footer>
    <p>IONOV TECH SHOP © 2026</p>
    <p style="font-size: 0.8em;">Made by ION</p>
</footer>

<script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; }

    function loadCart() {
        fetch('/api/cart', {headers: {'Authorization': 'Bearer ' + token}})
            .then(r => r.json())
            .then(items => {
                let html = '';
                let total = 0;
                items.forEach(i => {
                    total += i.product.price * i.quantity;
                    html += `<div class="card mb-2 p-3"><div class="row align-items-center">
                    <div class="col-md-2"><img src="${i.product.imageUrl}" style="width: 80px; border-radius: 10px;"></div>
                    <div class="col-md-4">${i.product.name}</div>
                    <div class="col-md-2">${i.quantity} шт.</div>
                    <div class="col-md-2">${i.product.price} ₽</div>
                    <div class="col-md-2"><button class="btn btn-danger btn-sm" onclick="removeItem(${i.id})">Удалить</button></div>
                </div></div>`;
                });
                document.getElementById('cartItems').innerHTML = html || '<p class="text-center">Корзина пуста</p>';
                document.getElementById('totalPrice').textContent = total;
                document.getElementById('totalBlock').style.display = items.length ? 'block' : 'none';
            });
    }

    function removeItem(id) {
        fetch('/api/cart/' + id, {method: 'DELETE', headers: {'Authorization': 'Bearer ' + token}})
            .then(() => loadCart());
    }

    function createOrder() {
        fetch('/api/orders', {method: 'POST', headers: {'Authorization': 'Bearer ' + token}})
            .then(r => { if (r.ok) { alert('Заказ оформлен!'); window.location.href = '/orders'; } });
    }

    loadCart();
</script>
</body>
</html>
