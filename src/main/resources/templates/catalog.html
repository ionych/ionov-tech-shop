<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | IONOV TECH SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; }
        .navbar { background: #1a1a2e; }
        footer { background: #1a1a2e; color: #aaa; padding: 20px 0; text-align: center; margin-top: 40px; }
        .card { border: none; transition: transform 0.2s; height: 100%; }
        .card:hover { transform: translateY(-5px); }
        .btn-blue { background: #2563eb; border: none; color: white; }
        .btn-blue:hover { background: #1d4ed8; color: white; }
        .img-container {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            overflow: hidden;
        }
        .img-container img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color: #2563eb;">IONOV TECH SHOP</a>
        <a href="/" class="btn btn-outline-light btn-sm">На главную</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="text-center mb-4">Каталог товаров</h2>
    <div class="row" id="catalog">
        <div class="col-12 text-center"><div class="spinner-border text-primary"></div></div>
    </div>
</div>

<footer>
    <p>IONOV TECH SHOP © 2026</p>
    <p style="font-size: 0.8em;">Made by ION</p>
</footer>

<script>
    fetch('/api/products')
        .then(r => r.json())
        .then(data => {
            let html = '';
            data.forEach(p => {
                html += `<div class="col-md-4 mb-4">
                <div class="card shadow-sm d-flex flex-column">
                    <div class="img-container">
                        <img src="${p.imageUrl}" alt="${p.name}">
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h5><a href="/product?id=${p.id}" style="color: #2563eb; text-decoration: none;">${p.name}</a></h5>
                        <p class="text-muted">${p.description || ''}</p>
                        <strong style="color: #2563eb; font-size: 1.3rem;">${p.price} ₽</strong>
                        <p class="text-muted small">В наличии: ${p.stock} шт.</p>
                        <button class="btn btn-blue btn-sm mt-auto" onclick="addToCart(${p.id})">В корзину</button>
                    </div>
                </div>
            </div>`;
            });
            document.getElementById('catalog').innerHTML = html;
        });

    function addToCart(productId) {
        const token = localStorage.getItem('token');
        if (!token) { alert('Войдите в аккаунт'); window.location.href = '/login'; return; }
        fetch('/api/cart', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
            body: JSON.stringify({productId: productId, quantity: 1})
        }).then(r => { if (r.ok) alert('Добавлено в корзину!'); else alert('Ошибка'); });
    }
</script>
</body>
</html>
