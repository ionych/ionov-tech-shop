<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | IONOV TECH SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 15px; }
        .btn-blue { background: #2563eb; border: none; color: white; }
        .btn-blue:hover { background: #1d4ed8; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">Вход</h3>
                    <form id="loginForm">
                        <input type="email" class="form-control mb-3" id="email" placeholder="Email" required>
                        <input type="password" class="form-control mb-3" id="password" placeholder="Пароль" required>
                        <button type="submit" class="btn btn-blue w-100">Войти</button>
                    </form>
                    <div id="message" class="mt-3 text-center"></div>
                    <p class="text-center mt-3"><a href="/register">Регистрация</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', e => {
        e.preventDefault();
        fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})
        }).then(r => r.json()).then(d => {
            if (d.token) {
                localStorage.setItem('token', d.token);
                localStorage.setItem('role', d.role);
                document.getElementById('message').innerHTML = '<div class="alert alert-success">Успешно!</div>';
                setTimeout(() => location.href = '/', 1000);
            } else {
                document.getElementById('message').innerHTML = '<div class="alert alert-danger">' + (d.error || 'Ошибка') + '</div>';
            }
        });
    });
</script>
</body>
</html>
