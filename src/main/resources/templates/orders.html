<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы | IONOV TECH SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; }
        .navbar { background: #1a1a2e; }
        footer { background: #1a1a2e; color: #aaa; padding: 20px 0; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color: #2563eb;">IONOV TECH SHOP</a>
        <a href="/" class="btn btn-outline-light btn-sm">На главную</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="text-center mb-4">Мои заказы</h2>
    <div id="ordersList"></div>
</div>

<footer>
    <p>IONOV TECH SHOP © 2026</p>
    <p style="font-size: 0.8em;">Made by ION</p>
</footer>

<script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; }

    fetch('/api/orders', {headers: {'Authorization': 'Bearer ' + token}})
        .then(r => r.json())
        .then(orders => {
            let html = '';
            orders.forEach(o => {
                html += `<div class="card mb-3 p-3">
                <h5>Заказ #${o.id}</h5>
                <p>Статус: <strong>${o.status}</strong> | Сумма: <strong style="color: #2563eb;">${o.totalPrice} ₽</strong></p>
                <small>${new Date(o.createdAt).toLocaleString('ru-RU')}</small>
            </div>`;
            });
            document.getElementById('ordersList').innerHTML = html || '<p class="text-center">Заказов пока нет</p>';
        });
</script>
</body>
</html>
