<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар | IONOV TECH SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; }
        .navbar { background: #1a1a2e; }
        .btn-blue { background: #2563eb; border: none; color: white; }
        .btn-blue:hover { background: #1d4ed8; color: white; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color: #2563eb;">IONOV TECH SHOP</a>
        <a href="/catalog" class="btn btn-outline-light btn-sm">В каталог</a>
    </div>
</nav>

<div class="container py-5" id="productDetail">
    <div class="text-center"><div class="spinner-border text-primary"></div></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    fetch('/api/products/' + productId)
        .then(r => r.json())
        .then(p => {
            document.getElementById('productDetail').innerHTML = `
            <div class="row">
                <div class="col-md-6">
                    <img src="${p.imageUrl}" class="img-fluid rounded" alt="${p.name}">
                </div>
                <div class="col-md-6">
                    <h1>${p.name}</h1>
                    <p class="text-muted">${p.description}</p>
                    <h2 style="color: #2563eb;">${p.price} ₽</h2>
                    <p>В наличии: ${p.stock} шт.</p>
                    <p>Категория: ${p.category.name}</p>
                    <button class="btn btn-blue btn-lg" onclick="addToCart(${p.id})">В корзину</button>
                    <a href="/catalog" class="btn btn-outline-secondary btn-lg ms-2">Назад</a>
                </div>
            </div>`;
        });

    function addToCart(productId) {
        const token = localStorage.getItem('token');
        if (!token) { alert('Войдите в аккаунт'); window.location.href = '/login'; return; }
        fetch('/api/cart', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
            body: JSON.stringify({productId: productId, quantity: 1})
        }).then(r => { if (r.ok) alert('Добавлено в корзину!'); else alert('Ошибка'); });
    }
</script>
</body>
</html>
